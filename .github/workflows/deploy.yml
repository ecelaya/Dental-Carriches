name: Deploy a IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Subir archivos por SFTP
        env:
          SFTP_HOST: home460724416.1and1-data.host
          SFTP_PORT: 22
          SFTP_USER: u72604236
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: /app460724435
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            open -u \"$SFTP_USER\",\"$SFTP_PASSWORD\" -p $SFTP_PORT sftp://$SFTP_HOST;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .claude/ \
              --exclude-glob .gitignore \
              --exclude-glob README.md \
              ./ \"$REMOTE_DIR\";
            bye
          "
